# Configuración productiva: sustituye docker-compose.yml al combinarse con él.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Convierte el despliegue en modo detrás de un proxy nginx con TLS. El puerto
# de la app deja de publicarse; sólo el proxy expone HTTPS_PORT (por defecto
# 8444; el 8443 corresponde a la pila del proyecto DAW). El proxy reescribe la
# IP del cliente con X-Forwarded-For para que el límite de intentos de acceso
# y las alertas registren la IP real, y marca la conexión como HTTPS para que
# PHP active cookies Secure.

services:
  app:
    ports: !override []
    volumes:
      # SetEnvIf convierte X-Forwarded-Proto en $_SERVER['HTTPS'] para PHP.
      - ./deploy/apache/produccion.conf:/etc/apache2/conf-enabled/produccion.conf:ro
    networks:
      facturacion:
        ipv4_address: 172.32.32.10

  # Genera un certificado autofirmado la primera vez. TLS_CN admite un nombre
  # DNS o una IP (por ejemplo la dirección del servidor en la red local) y se
  # refleja en el SAN correcto. Para usar certs reales, colocarlos en el
  # volumen tls-certs como fullchain.pem y privkey.pem antes del primer
  # arranque (o sustituirlos después y reiniciar el proxy).
  tls-certs-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssl >/dev/null
        if [ ! -f /certs/fullchain.pem ] || [ ! -f /certs/privkey.pem ]; then
          CN="${TLS_CN:-localhost}"
          case "$$CN" in
            *[!0-9.:]*) SAN="DNS:$$CN" ;;
            *) SAN="IP:$$CN" ;;
          esac
          echo "Generando certificado TLS autofirmado para $$CN ($$SAN)..."
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout /certs/privkey.pem -out /certs/fullchain.pem \
            -subj "/CN=$$CN" \
            -addext "subjectAltName=$$SAN,DNS:localhost,IP:127.0.0.1"
        else
          echo "Certificados existentes en tls-certs; se conservan."
        fi
    volumes:
      - tls-certs:/certs

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
      tls-certs-init:
        condition: service_completed_successfully
    ports:
      - "${HTTPS_PORT:-8444}:443"
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - tls-certs:/certs:ro
    restart: unless-stopped
    networks:
      facturacion:
        ipv4_address: 172.32.32.20

volumes:
  tls-certs:

# Proxy TLS para la configuración productiva (docker-compose.prod.yml).
# TLS se termina en nginx y el salto a Apache es HTTP con X-Forwarded-Proto.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Las facturas envían el detalle completo en JSON; margen holgado.
    client_max_body_size 2m;

    # IP real del cliente: REMOTE_ADDR alimenta el límite de intentos de
    # acceso (api/index.php) y el registro de alertas (api/seguridad.php).
    set_real_ip_from 172.32.32.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location / {
        proxy_pass http://app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 45s;
    }
}

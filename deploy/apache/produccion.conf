# Ajuste para despliegue tras el proxy TLS (montado por docker-compose.prod.yml).

# IP real del cliente: Apache ve como par al contenedor nginx, por lo que
# RemoteIP reescribe REMOTE_ADDR desde X-Forwarded-For. Se usa InternalProxy
# y no TrustedProxy porque las direcciones privadas —de las que proceden los
# clientes de la red local— sólo se aceptan como IP final cuando las presenta
# un proxy interno registrado; la red del compose es de donde llega nginx.
# Una cadena falsificada por el cliente no puede suplantarse: nginx añade la
# IP real de su par al final de la cabecera y esa IP no está en la lista, con
# lo que el recorrido de derecha a izquierda se detiene en ella.
# El resultado alimenta el límite de intentos de acceso y las alertas.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.32.32.0/24

# PHP decide el atributo Secure de la cookie de sesión con $_SERVER['HTTPS'];
# tras el proxy la conexión interna es HTTP, por lo que se marca como HTTPS
# cuando nginx declara X-Forwarded-Proto: https.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
